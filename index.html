<title>Servo Press QC</title>
<style>
:root{--page:#F6F3FC;--panel:#FFFFFF;--text:#1E1630;--muted:#5E5573;--ink:#3B2670;--edge:#CFC3EC;--lav:#E9E3F5;--focus:#7C5CD6;
--f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fc:"Barlow Condensed","Barlow",system-ui,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--page:#15111D;--panel:#1E1829;--text:#EEE9F8;--muted:#B3A9C9;--ink:#CDBDF5;--edge:#3D3359;--lav:#2B2340;--focus:#B49CF0}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--f);line-height:1.4}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:#3B2670;color:#fff}
.logo{background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;height:42px}
.logo img{height:36px;width:auto;display:block}
.brand{font-family:var(--fc);font-weight:600;font-size:22px;letter-spacing:.2px;line-height:1.1}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:var(--fc);font-weight:600;font-size:28px;margin:0 0 4px;color:var(--ink)}
p{margin:0 0 20px;color:var(--muted)}
a.card{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;margin:0 0 12px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--text);text-decoration:none;font-family:var(--fc);font-weight:600;font-size:21px}
a.card span{color:var(--ink);font-size:24px}
a.card:hover{background:var(--lav)}
a.card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media(max-width:480px){.top{padding:8px 12px;gap:10px}.brand{font-size:19px}}
